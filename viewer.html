<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Model</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
margin:0;
background:#000;
}
model-viewer{
width:100%;
height:100vh;
}
</style>
</head>
<body>

<model-viewer 
src="model1.glb"
auto-rotate
camera-controls
environment-image="neutral"
exposure="1.2"
shadow-intensity="1">
</model-viewer>

</body>
</html>
